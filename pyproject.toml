[project]
name = "kobby-manager"
version = "0.1.0"
description = "AI Talent Manager for Kobby Cooper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "tenacity>=9.0",
    "mcp>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
    "openai>=1.55",
]
video = [
    "ffmpeg-python>=0.2",
    "whisper-timestamped>=1.15",
    "pillow>=11.0",
]
worker = [
    "celery[redis]>=5.4",
    "redis>=5.2",
]
auth = [
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.21",
]
all = [
    "kobby-manager[ai,video,worker,auth]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
